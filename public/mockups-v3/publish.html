<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/mockups-v3/">
    <title>Publish · OpenHub v3</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-screen publish-screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="system-icons" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 18h2M8 15h2M12 12h2M16 9h2"/></svg>
          <svg viewBox="0 0 24 24"><path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 13a8 8 0 0 1 11 0M10 16.5a3 3 0 0 1 4 0"/></svg>
          <svg class="battery" viewBox="0 0 28 16"><rect x="1" y="2" width="23" height="12" rx="3"/><path d="M26 6v4"/><path d="M4 5h14v6H4z" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="sheet-surface">
        <header class="topbar centered">
          <div class="topbar-left"><a class="button text" href="compose.html">Cancel</a></div>
          <span class="topbar-title small">Publish</span>
          <div class="topbar-right"><a class="button text" href="compose.html">Save draft</a></div>
        </header>
        <main class="publish-main">
          <section class="publish-section">
            <p class="section-label">Audience</p>
            <div class="publish-group">
              <div class="publish-row">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c.7-3.1 3-5 7-5s6.3 1.9 7 5"/></svg>
                <span class="publish-row-copy"><strong>Everyone</strong><span>Anyone can read this note</span></span>
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
              </div>
              <div class="publish-row">
                <svg viewBox="0 0 24 24"><path d="M6 11V8a6 6 0 0 1 12 0v3M5 11h14v9H5z"/></svg>
                <span class="publish-row-copy"><strong>Replies</strong><span>Subscribers and members</span></span>
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
              </div>
            </div>
          </section>
          <section class="publish-section">
            <p class="section-label">Send to</p>
            <div class="publish-group">
              <div class="publish-row">
                <span class="publication-thumb orange">S</span>
                <span class="publish-row-copy"><strong>The Signal</strong><span>2,481 subscribers</span></span>
                <button class="toggle" type="button" data-demo-toggle aria-label="Send to The Signal subscribers" aria-pressed="true"></button>
              </div>
              <div class="publish-row">
                <svg viewBox="0 0 24 24"><path d="M5 6h14v12H5zM8 9h8M8 12h5"/></svg>
                <span class="publish-row-copy"><strong>Show in your notes</strong><span>Visible on your profile</span></span>
                <button class="toggle" type="button" data-demo-toggle aria-label="Show in notes" aria-pressed="true"></button>
              </div>
            </div>
          </section>
          <section class="publish-section">
            <p class="section-label">Delivery</p>
            <div class="publish-group">
              <div class="publish-row">
                <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM7 4h10v3H7zM8 11h8M8 14h5"/></svg>
                <span class="publish-row-copy"><strong>Send an email</strong><span>Include this in the next digest</span></span>
                <button class="toggle" type="button" data-demo-toggle aria-label="Send an email" aria-pressed="true"></button>
              </div>
              <div class="publish-row">
                <svg viewBox="0 0 24 24"><path d="M12 4v12M7 9l5-5 5 5M5 19h14"/></svg>
                <span class="publish-row-copy"><strong>Schedule</strong><span>Publish now · Mon, 9 Sep</span></span>
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
              </div>
            </div>
          </section>
          <button class="publish-cta" type="button">Send to all subscribers now</button>
        </main>
      </div>
    </div>
    <script src="mockups.js"></script>
  </body>
</html>
